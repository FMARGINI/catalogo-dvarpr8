name: Sync JIRA → Firebase

on:
  schedule:
    - cron: '0 */2 * * *'   # executa a cada 2 horas
  workflow_dispatch:          # permite disparo manual pelo botão no GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar sincronização JIRA → Firebase
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_PASS: ${{ secrets.JIRA_PASS }}
        run: python3 scripts/sync_jira.py
